spring:
  application:
    name: payment-simulator

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_simulator
    username: postgres
    password: Password@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true



server:
  port: 8081

payment:
  simulator:
    processing-delay: 10000
    success-percentage: 90

webhook:
  ecomm-url: http://localhost:8080/api/payments/webhook
